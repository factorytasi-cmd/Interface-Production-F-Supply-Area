<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0A1A1D">
  <title>LITRA-ASI — Daily Issue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A1A1D;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .phone {
      width: 100%;
      max-width: 420px;
      background: #0A1A1D;
      border-radius: 28px;
      overflow: hidden;
      border: 0.5px solid rgba(255,255,255,0.08);
    }

    /* HEADER */
    .header-zone {
      background: #0A1A1D;
      padding: 16px 22px 28px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.5px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #378ADD, #1D9E75);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 26px;
      font-weight: 700;
      color: white;
      letter-spacing: 1.5px;
    }

    .tagline {
      text-align: center;
      font-size: 9px;
      color: #5DCAA5;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,0.28);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .date-pill {
      display: flex;
      justify-content: center;
    }

    .date-pill span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.06);
      border: 0.5px solid rgba(255,255,255,0.12);
      border-radius: 99px;
      padding: 6px 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }

    /* CONTENT */
    .content-zone {
      background: #F0F2F1;
      padding: 24px 18px;
    }

    .section-lbl {
      font-size: 10px;
      color: #999;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      display: block;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
      -webkit-touch-callout: none;
    }

    .card:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .card-issue {
      background: rgba(55, 138, 221, 0.1);
      border: 0.5px solid rgba(55, 138, 221, 0.22);
    }

    .card-inner {
      padding: 20px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .card-badge {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .badge-issue { background: rgba(55,138,221,0.15); color: #134E8A; }

    .icon-issue { background: rgba(55,138,221,0.15); }

    .card-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-title {
      font-size: 22px;
      font-weight: 600;
      color: #111;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .card-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-hint {
      font-size: 11px;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      border: 1.5px solid;
    }

    .btn-issue {
      background: rgba(55,138,221,0.1);
      color: #134E8A;
      border-color: rgba(55,138,221,0.3);
    }

    /* FOOTER */
    .footer-zone {
      background: #0A1A1D;
      padding: 16px 18px 28px;
    }

    .live-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1D9E75;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .live-txt {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
    }

    /* Responsive full screen on small phones */
    @media (max-width: 420px) {
      body { padding: 0; align-items: flex-start; }
      .phone { border-radius: 0; min-height: 100vh; border: none; }
      .header-zone { padding-top: env(safe-area-inset-top, 20px); }
      .footer-zone { padding-bottom: env(safe-area-inset-bottom, 28px); }
    }
  </style>
</head>
<body>

  <div class="phone">
    <!-- HEADER -->
    <div class="header-zone">
      <div class="status-bar">
        <span>PT. ASI</span>
        <span id="waktu">--:--</span>
      </div>

      <div class="logo-wrap">
        <div class="logo-box">L</div>
        <div class="logo-text">LITRA-ASI</div>
      </div>

      <div class="tagline">Leading Industrial Transformation</div>
      <div class="subtitle">Lean Intelligence Tracking &amp; Realtime Analytics — ASI</div>

      <div class="date-pill">
        <span>
          <i class="ti ti-calendar" style="font-size:13px"></i>
          <span id="tgl">Memuat...</span>
        </span>
      </div>
    </div>

    <div style="text-align:center;margin-top:4px">
      <div style="font-size:22px;font-weight:700;color:white;letter-spacing:3px;text-transform:uppercase;line-height:1.2">SUPPLY AREA</div>
      <div style="width:40px;height:2px;background:linear-gradient(90deg,#378ADD,#1D9E75);border-radius:99px;margin:8px auto 0"></div>
    </div>

    <!-- CONTENT -->
    <div class="content-zone">
      <div class="section-lbl">Input Data Produksi</div>

      <div class="cards">
        <a class="card card-issue" href="https://factorytasi-cmd.github.io/daily-issue/" target="_blank" rel="noopener">
          <div class="card-inner">
            <div class="card-top">
              <span class="card-badge badge-issue">Harian</span>
              <div class="card-icon-wrap icon-issue">
                <i class="ti ti-alert-triangle" style="font-size:20px;color:#378ADD"></i>
              </div>
            </div>
            <div class="card-title">Daily Issue</div>
            <div class="card-desc">Rekam kendala dan issue dari leader line produksi setiap shift</div>
            <div class="card-footer">
              <span class="card-hint">
                <i class="ti ti-file-description" style="font-size:13px"></i>
                Input tiap shift
              </span>
              <span class="card-btn btn-issue">
                Buka <i class="ti ti-arrow-right" style="font-size:14px"></i>
              </span>
            </div>
          </div>
        </a>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-zone">
      <div class="live-row">
        <div class="live-dot"></div>
        <div class="live-txt">Sistem aktif — PT. ASI Sewing Division</div>
      </div>
    </div>
  </div>

  <script>
    function update() {
      const now = new Date();
      const hh = now.getHours().toString().padStart(2, '0');
      const mm = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('waktu').textContent = hh + ':' + mm;

      const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
      const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
      document.getElementById('tgl').textContent =
        days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    }

    update();
    setInterval(update, 30000);
  </script>
</body>
</html>
